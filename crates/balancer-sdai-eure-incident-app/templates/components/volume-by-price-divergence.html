<figure class="mt-16">
  <div id="chart-volume-by-price-divergence" class="aspect-video rounded-xl bg-gray-50 object-cover"></div>
  <script type="text/javascript">
    const chartVolumeByPriceDivergenceData = [{% for data in volume_by_price_divergence %}[{{data.price_divergence_bp}}, {{data.price_divergence_value_profit}}, {{data.price_divergence_value_loss}}],{% endfor %}];
  </script>

  <script type="text/javascript">
    let chartVolumeByPriceDivergence = echarts.init(document.getElementById('chart-volume-by-price-divergence'));

    let chartVolumeByPriceDivergenceOption = {
      dataset:{
        source: chartVolumeByPriceDivergenceData,
        dimensions: ['timestamp', 'Volume by price divergence profit', 'Volume by price divergence loss'],
      },
      toolbox: {
        feature: {
          dataZoom: {
            yAxisIndex: 'none'
          },
          restore: {},
          saveAsImage: {}
        }
      },
      tooltip: {},
      legend: {},
      xAxis: {
        type: 'value',
        axisLabel: {
          formatter: '{value} bp'
        }
      },
      yAxis: [
        {
          type: 'value',
          scale: true,
          alignTicks: true,
          axisLabel: {
            formatter: '{value} $'
          }
        },
        {
          type: 'value',
          scale: true,
          alignTicks: true,
          axisLabel: {
            formatter: '{value} $'
          }
        }
      ],
      dataZoom: [
        {
          show: true,
        },
        {
          type: 'inside',
        },
      ],
      series: [
        {
          name: 'Volume by price divergence profit',
          type: 'bar',
          showSymbol: false,
          sampling: 'lttb',
          encode: {
            x: 'timestamp',
            y: 'Volume by price divergence profit'
          }
        },
        {
          name: 'Volume by price divergence loss',
          type: 'bar',
          showSymbol: false,
          step: 'end',
          sampling: 'lttb',
          encode: {
            x: 'timestamp',
            y: 'Volume by price divergence loss'
          }
        }
      ]
    };

    chartVolumeByPriceDivergence.setOption(chartVolumeByPriceDivergenceOption);
  </script>
  <figcaption class="mt-4 flex gap-x-2 text-sm/6 text-gray-500">
    <svg class="mt-0.5 size-5 flex-none text-gray-300" viewBox="0 0 20 20" fill="currentColor"
         aria-hidden="true" data-slot="icon">
      <path fill-rule="evenodd"
            d="M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0Zm-7-4a1 1 0 1 1-2 0 1 1 0 0 1 2 0ZM9 9a.75.75 0 0 0 0 1.5h.253a.25.25 0 0 1 .244.304l-.459 2.066A1.75 1.75 0 0 0 10.747 15H11a.75.75 0 0 0 0-1.5h-.253a.25.25 0 0 1-.244-.304l.459-2.066A1.75 1.75 0 0 0 9.253 9H9Z"
            clip-rule="evenodd"/>
    </svg>
    Volume by price divergence profit and loss
  </figcaption>
</figure>
