<figure class="mt-16">
  <div id="chart-cumulative-losses" class="aspect-video rounded-xl bg-gray-50 object-cover"></div>
  <script type="text/javascript">
    const chartCumulativeLossesData = [{% for data in cumulative_profit_loss_data_vec %}["{{data.date}}", {{data.profit_loss}}, {{data.cumulative_profit_loss}}],{% endfor %}];
  </script>

  <script type="text/javascript">
    let chartCumulativeLosses = echarts.init(document.getElementById('chart-cumulative-losses'));

    // Specify the configuration items and data for the chart
    let chartCumulativeLossesOption = {
      dataset:{
        source: chartCumulativeLossesData,
        dimensions: ['timestamp', 'P&L', 'Cumulative P&L'],
      },
      toolbox: {
        feature: {
          dataZoom: {
            yAxisIndex: 'none'
          },
          restore: {},
          saveAsImage: {}
        }
      },
      tooltip: {},
      legend: {},
      xAxis: {
        type: 'time',
      },
      yAxis: [
        {
          type: 'value',
          scale: true,
          alignTicks: true,
          axisLabel: {
            formatter: '{value} $'
          }
        },
        {
          type: 'value',
          scale: true,
          alignTicks: true,
          axisLabel: {
            formatter: '{value} $'
          }
        }
      ],
      dataZoom: [
        {
          show: true,
        },
        {
          type: 'inside',
        },
      ],
      series: [
        {
          name: 'P&L',
          yAxisIndex: 1,
          type: 'bar',
          sampling: 'lttb',
          encode: {
            x: 'timestamp',
            y: 'P&L'
          }
        },
        {
          name: 'Cumulative P&L',
          type: 'line',
          showSymbol: false,
          step: 'end',
          sampling: 'lttb',
          encode: {
            x: 'timestamp',
            y: 'Cumulative P&L'
          },
          markLine: {
            symbol: ['none', 'none'],
            label: { show: false },
            data: [{name: 'Price cache updated', xAxis: dateCacheExpirationUpdated}]
          }
        }
      ]
    };

    chartCumulativeLosses.setOption(chartCumulativeLossesOption);
  </script>
  <figcaption class="mt-4 flex gap-x-2 text-sm/6 text-gray-500">
    <svg class="mt-0.5 size-5 flex-none text-gray-300" viewBox="0 0 20 20" fill="currentColor"
         aria-hidden="true" data-slot="icon">
      <path fill-rule="evenodd"
            d="M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0Zm-7-4a1 1 0 1 1-2 0 1 1 0 0 1 2 0ZM9 9a.75.75 0 0 0 0 1.5h.253a.25.25 0 0 1 .244.304l-.459 2.066A1.75 1.75 0 0 0 10.747 15H11a.75.75 0 0 0 0-1.5h-.253a.25.25 0 0 1-.244-.304l.459-2.066A1.75 1.75 0 0 0 9.253 9H9Z"
            clip-rule="evenodd"/>
    </svg>
    Cumulative P&L from price divergence
  </figcaption>
</figure>
